name: Build ClipForge AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClipForge_AI_Android_MVP_0.1.0.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: test -f ClipForge_AI_Android_MVP_0.1.0.zip

      - name: Extract source archive on GitHub runner
        run: unzip -q ClipForge_AI_Android_MVP_0.1.0.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages using runner SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle -p clipforge-ai-android testDebugUnitTest

      - name: Build debug APK
        run: gradle -p clipforge-ai-android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-debug-APK
          path: clipforge-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
